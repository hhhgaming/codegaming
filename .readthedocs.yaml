# Required
version: 2

# Set the OS, Python version, and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
    # ruby: "3.3"
    # nodejs: "22"
    # rust: "1.82"
    # golang: "1.23"

  commands:
    - python3 -c "import shutil, os; shutil.copytree('.', os.environ['READTHEDOCS_OUTPUT'] + '/html', ignore=shutil.ignore_patterns('_readthedocs', '.git'), dirs_exist_ok=True)"
    # Write down your commands here to:
    #
    #  - Install the dependencies of your project
    #  - Build the documentation
    #  - Save the generated files in $READTHEDOCS_OUTPUT/html
        
