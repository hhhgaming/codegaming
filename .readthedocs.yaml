version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - rsync
  jobs:
    build:
      html:
        - mkdir -p "$READTHEDOCS_OUTPUT/html"
        - |
          rsync -a \
            --exclude='.git' \
            --exclude='.github/' \
            --exclude='.readthedocs.yaml' \
            --exclude='_readthedocs/' \
            --exclude='node_modules/' \
            ./ "$READTHEDOCS_OUTPUT/html/"
